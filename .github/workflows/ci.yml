name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # mise-action caches its installed tools (go, golangci-lint, rumdl,
      # shellcheck, controller-gen, ...) by default.
      #
      # mise itself is pinned. The mise:check task regenerates mise.lock and fails
      # on any diff, so an unpinned mise means any mise release that changes lockfile
      # output breaks CI on every open PR at once, with a diff nobody authored. The
      # customManager in renovate.json keeps this current, which turns that class of
      # break into a reviewable PR instead of a surprise.
      - uses: jdx/mise-action@v4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.9.1
      # Cache the Go module/build caches and golangci-lint cache, which
      # mise-action does not cover. This is where `mise run ci` spends most of
      # its time (module downloads, `go test -race`, golangci-lint).
      - name: Cache Go and lint caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-mcpfabric-ci-${{ hashFiles('operator/go.sum', 'gateway/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-mcpfabric-ci-
      - run: mise run ci
